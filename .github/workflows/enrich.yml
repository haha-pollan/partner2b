name: Company enrichment

# Runs the company enrichment job every hour. Vercel's free plan only allows one scheduled run a day, so GitHub does the extra runs.
# Needs the repository secret CRON_SECRET (the same value as in Vercel).
on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call the enrichment endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set in the repository secrets"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://partner2b.com/api/cron/enrich
